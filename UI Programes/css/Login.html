<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 100%;
            min-height: 400px;
            border: 1px solid black;
            position: relative;
            color: white;
            display: flex;
            flex-direction: column;




        }

        .container img {
            width: 100%;
            height: 650px;

        }

        .header {
            display: flex;
            width: 100%;
            height: 60px;

            margin-top: 10px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translate(-50%, -50%);
            flex-basis: 40%;



        }

        .header .logo {
            flex-basis: 60%;
            padding: 10px;
        }

        .menu {
            display: flex;
            flex-basis: 60%;


        }

        .menu ul {
            display: flex;
            gap: 100px;
            list-style-type: none;
            align-items: end;
            justify-content: end;
            font-size: x-large;
            padding-top: 30px;


        }

        .menu ul li {
            justify-content: end;
            align-items: end;
        }

        ul li a {
            justify-content: end;
            align-items: center;
        }
 .login-box {
            width: 30%;
            height: 400px;
            border: 1px solid white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
           
            position: absolute;
            background-color: darkgray;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: red;
        }
        
        input{
            width: 300px;
            height: 40px;
            margin: 10px;
            border-radius: 20px;
            margin-top: 20px;
            text-align: center;
            background-color: aqua;


            
        }
       
    </style>

</head>

<body>
    <div class="container">
        <img src="/img/Laptop img.jpeg" alt="Background">

        <div class="header">
            <div class="logo">
                <h1>ByteCode</h1>
            </div>
            <div class="menu">
                <ul>
                    <li><a>Home</a></li>
                    <li><a>About</a></li>
                    <li><a>Services</a></li>
                    <li><a>Contact</a></li>
                </ul>

            </div>

        </div>
       

        </div>
       



    </div>
    <div class="login-box">
        <h1>Welcome</h1>
      <a href="./LoginServ.html"><input type="text" name="register" id="register" value="Register"></a>
       <a href="./RegisterPageServ.html"><input type="text" name="Login" id="Login" value="Login"></a>
    </div>
  

    </div>

</body>

</html>
